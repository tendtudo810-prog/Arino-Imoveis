<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/cadastro.css" />
  </head>
  <body>
    <video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260503_144509_89e2d612-8af2-45c3-90f4-4831bc60715d.mp4" autoplay muted loop class="vid"></video>

    <main>
      <div class="card">
        <div class="login-box">
          <div class="logo">
            <img src="pic1/Black & White (1).png" alt="" class="picture" />
            <p>Arino Imóveis</p>
          </div>

          <div class="texto">
            <h2>Crie a Sua Conta</h2>
            <p>Faça o seu cadastro e entre veja nossos anúncios</p>
          </div>

          <form>
            <div class="form-group">
              <label for="text">Nome</label>
              <input type="text" placeholder="Digite Seu Nome Completo" />
            </div>

            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" placeholder="voce@gmail.com" />
            </div>

            <div class="form-group">
              <label for="password">Senha</label>
              <input type="password" id="password" placeholder="••••••••" />
            </div>

            <div class="form-group">
              <label for="password">Confirmar Senha</label>
              <input
                type="password"
                id="password"
                placeholder="Digite Sua Senha Novamente"
              />
            </div>

            <button type="submit" class="kindly-submit">
              <span>Entrar</span>
            </button>
          </form>

          <div class="divider">ou</div>

          <div class="social-login">
            <button
              type="button"
              class="social-btn"
              aria-label="Continuar com Google"
            >
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path
                  fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                />
                <path
                  fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                />
                <path
                  fill="#FBBC05"
                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                />
                <path
                  fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                />
              </svg>
              <span>Entrar com Google</span>
            </button>
          </div>

          <a href="index.html" class="voltar">Voltar</a>
        </div>
      </div>
    </main>
  </body>
</html>
