<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo anúncio | ARINO IMÓVEIS</title>
    <link rel="stylesheet" href="css/postar.css">
</head>
<body>
    <main class="post-page">
        <a class="back-link" href="index.html">← Voltar para o site</a>
        <header class="post-header">
            <div>
                <span>ÁREA RESTRITA</span>
                <h1>Publicar anúncio</h1>
                <p>Cadastre um imóvel e publique-o imediatamente no site.</p>
            </div>
            <button id="logoutButton" class="secondary-button" type="button">Sair</button>
        </header>

        <form id="propertyForm" class="property-form">
            <label>Título<input id="titulo" name="titulo" required></label>
            <label>Tipo<select id="tipo" name="tipo" required><option value="">Selecione</option><option>Apartamento</option><option>Casa</option><option>Chácara</option><option>Comercial</option><option>Conjunto</option><option>Terreno</option></select></label>
            <label>Preço<input id="preco" name="preco" type="number" min="0" step="0.01" required></label>
            <label>Cidade<input id="cidade" name="cidade" required></label>
            <label>Estado<input id="estado" name="estado" maxlength="2" required></label>
            <label>Localização<input id="localizacao" name="localizacao"></label>
            <label>Área (m²)<input id="area" name="area" type="number" min="0" step="0.01"></label>
            <label>Quartos<input id="quartos" name="quartos" type="number" min="0"></label>
            <label>Banheiros<input id="banheiros" name="banheiros" type="number" min="0"></label>
            <label>Vagas<input id="vagas" name="vagas" type="number" min="0"></label>
            <label class="wide">Descrição<textarea id="descricao" name="descricao" rows="6"></textarea></label>
            <label class="wide">Fotos (uma URL ou caminho por linha)<textarea id="fotos" name="fotos" rows="5" placeholder="imovel1/Anuncio 1 (6).jpeg"></textarea></label>
            <label class="checkbox wide"><input id="destaque" name="destaque" type="checkbox"> Marcar como imóvel em destaque</label>
            <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
            <button class="primary-button wide" type="submit">Publicar anúncio</button>
        </form>
    </main>
    <script src="js/config.js"></script>
    <script src="js/postar.js"></script>
</body>
</html>
