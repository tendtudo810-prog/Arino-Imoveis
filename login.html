<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Área administrativa da Arino Imóveis"
    >

    <title>Login | Arino Imóveis</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>


    <!-- =====================================
         LOGIN
    ====================================== -->

    <main class="login-container">

        <section class="login-card">

            <!-- LOGO -->

            <div class="brand">

                <span class="brand-name">
                    ARINO
                </span>

                <span class="brand-subtitle">
                    IMÓVEIS
                </span>

            </div>


            <!-- TÍTULO -->

            <div class="login-heading">

                <span class="eyebrow">
                    ÁREA RESTRITA
                </span>

                <h1>
                    Bem-vindo
                    <br>
                    <span>de volta.</span>
                </h1>

                <p>
                    Acesse o painel administrativo
                    da Arino Imóveis.
                </p>

            </div>


            <!-- FORMULÁRIO -->

            <form
                id="loginForm"
                class="login-form"
                novalidate
            >

                <!-- E-MAIL -->

                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            />

                            <polyline
                                points="3,7 12,13 21,7"
                            />
                        </svg>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="admin@arinoimoveis.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            />

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            />
                        </svg>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Mostrar senha"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- MENSAGEM DA API -->

                <div
                    id="mensagem"
                    class="mensagem"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    <span>
                        Entrar no painel
                    </span>

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <line
                            x1="5"
                            y1="12"
                            x2="19"
                            y2="12"
                        />

                        <polyline
                            points="12,5 19,12 12,19"
                        />

                    </svg>

                </button>

            </form>


            <!-- VOLTAR -->

            <div class="login-footer">

                <a href="index.html">
                    <span>←</span>
                    Voltar para o site
                </a>

            </div>

        </section>


        <!-- COPYRIGHT -->

        <div class="copyright">
            © 2026 Arino Imóveis
        </div>

    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
